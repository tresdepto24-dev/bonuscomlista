<!-- Scripts de Firebase blindados para lectura y guardado persistente -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAPAI1gTljTiynlWgGa-hOALMtCnjCUFOo",
            authDomain: "bonmuscomlistado1.firebaseapp.com",
            projectId: "bonmuscomlistado1",
            storageBucket: "bonmuscomlistado1.firebasestorage.app",
            messagingSenderId: "137381243576",
            appId: "1:137381243576:web:85c2890572a1228501a24d",
            measurementId: "G-24NSYJ0K50"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dbRef = ref(db);

        const totalAvisos = 50;
        const contenedor = document.getElementById('grillaAvisos');

        // 1. Generar la estructura de los 50 casilleros
        for (let i = 1; i <= totalAvisos; i++) {
            const numStr = i < 10 ? '00' + i : (i < 100 ? '0' + i : i);
            contenedor.innerHTML += `
                <div class="tarjeta-aviso" id="tarjeta-${i}">
                    <h3>
                        <span>Rubro N° ${numStr}</span>
                        <span id="hash-${i}" style="font-size:0.55rem; color:#7c4e31;">HASH: --------</span>
                    </h3>
                    <div class="meta-aviso" id="meta-${i}">Actualizado: --/--/---- --:-- hs</div>
                    
                    <!-- Vista editable (Formulario) -->
                    <div id="form-edit-${i}">
                        <input type="text" id="titulo-${i}" class="campo-input" placeholder="Comercio / Actividad">
                        <textarea id="texto-${i}" class="campo-textarea" placeholder="Teléfono, dirección y datos..."></textarea>
                        <button class="btn btn-guardar" id="btn-g-${i}" type="button">💾 Guardar Casillero</button>
                    </div>

                    <!-- Vista fija (Texto impreso bloqueado) -->
                    <div id="vista-fija-${i}" style="display: none;">
                        <div class="contenido-fijo">
                            <div class="titulo-fijo" id="fijo-titulo-${i}"></div>
                            <div class="texto-fijo" id="fijo-texto-${i}"></div>
                        </div>
                        <button class="btn btn-editar" id="btn-e-${i}" type="button">✏️ Modificar Aviso</button>
                    </div>
                </div>
            `;
        }

        // 2. Función global para congelar el casillero en modo FIJO
        window.fijarCasillero = function(id, titulo, texto, hashId, fechado) {
            const tFijo = document.getElementById(`fijo-titulo-${id}`);
            const tTexto = document.getElementById(`fijo-texto-${id}`);
            const hEl = document.getElementById(`hash-${id}`);
            const mEl = document.getElementById(`meta-${id}`);

            if (tFijo) tFijo.innerText = titulo || '';
            if (tTexto) tTexto.innerText = texto || '';
            if (hashId && hEl) hEl.innerText = 'HASH: ' + hashId;
            if (fechado && mEl) mEl.innerText = 'Actualizado: ' + fechado;

            const formEdit = document.getElementById(`form-edit-${id}`);
            const vistaFija = document.getElementById(`vista-fija-${id}`);
            if (formEdit) formEdit.style.display = 'none';
            if (vistaFija) vistaFija.style.display = 'block';
        };

        // 3. Función global para volver a editar
        window.habilitarEdicion = function(id) {
            const elTituloFijo = document.getElementById(`fijo-titulo-${id}`);
            const elTextoFijo = document.getElementById(`fijo-texto-${id}`);
            const inputTitulo = document.getElementById(`titulo-${id}`);
            const inputTexto = document.getElementById(`texto-${id}`);

            if (elTituloFijo && inputTitulo) inputTitulo.value = elTituloFijo.innerText;
            if (elTextoFijo && inputTexto) inputTexto.value = elTextoFijo.innerText;

            const vistaFija = document.getElementById(`vista-fija-${id}`);
            const formEdit = document.getElementById(`form-edit-${id}`);
            if (vistaFija) vistaFija.style.display = 'none';
            if (formEdit) formEdit.style.display = 'block';
        };

        // 4. Asignar eventos a los botones de guardar y editar de cada tarjeta
        for (let i = 1; i <= totalAvisos; i++) {
            const btnGuardar = document.getElementById(`btn-g-${i}`);
            if (btnGuardar) {
                btnGuardar.addEventListener('click', () => {
                    const id = i;
                    const campoTitulo = document.getElementById(`titulo-${id}`);
                    const campoTexto = document.getElementById(`texto-${id}`);
                    
                    const titulo = campoTitulo ? campoTitulo.value.trim() : '';
                    const texto = campoTexto ? campoTexto.value.trim() : '';

                    if (!titulo || !texto) {
                        alert("Completá el título y la descripción para fijar el aviso.");
                        return;
                    }

                    const ahora = new Date();
                    const fechado = ahora.toLocaleDateString('es-AR') + ' ' + ahora.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
                    const hashId = 'TEL-' + Math.random().toString(36).substring(2, 8).toUpperCase();

                    const avisoRef = ref(db, 'bonuscom_guia_tel_50/aviso_' + id);
                    set(avisoRef, { 
                        titulo: titulo, 
                        texto: texto, 
                        fechado: fechado, 
                        hashId: hashId 
                    }).then(() => {
                        fijarCasillero(id, titulo, texto, hashId, fechado);
                    }).catch((error) => {
                        alert('Error al guardar: ' + error.message);
                    });
                });
            }

            const btnEditar = document.getElementById(`btn-e-${i}`);
            if (btnEditar) {
                btnEditar.addEventListener('click', () => {
                    habilitarEdicion(i);
                });
            }
        }

        // 5. Cargar datos desde Firebase al abrir la página y restaurarlos de forma segura
        get(child(dbRef, 'bonuscom_guia_tel_50')).then((snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                for (let i = 1; i <= totalAvisos; i++) {
                    const item = data['aviso_' + i];
                    if (item) {
                        const t = item.titulo || '';
                        const tx = item.texto || '';
                        if (t || tx) {
                            fijarCasillero(i, t, tx, item.hashId, item.fechado);
                        }
                    }
                }
            }
        }).catch((error) => {
            console.error("Error al cargar datos:", error);
        });
    </script>
